name: memberlike
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  accordion: ^2.6.0
  awesome_dialog: ^3.2.1
  bottom_sheet: ^4.0.4
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  crypto: ^3.0.6
  flutter_easyloading: ^3.0.5
  flutter_html: ^3.0.0
  flutter_localization: ^0.3.2
  flutter_native_splash: ^2.4.6
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.12
  freezed: ^3.0.6
  freezed_annotation: ^3.0.0
  get: ^4.7.2
  get_storage: ^2.1.1
  google_sign_in: ^6.3.0
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  json_annotation: ^4.9.0
  loading_animation_widget: ^1.3.0
  myket_iap: ^1.1.11
  permission_handler: ^12.0.0+1
  persian_datetime_picker: ^3.1.0
  photo_view: ^0.15.0
  shamsi_date: ^1.0.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.8.4
  syncfusion_flutter_sliders: ^29.1.37
  syncfusion_flutter_charts: ^29.1.37+1
  syncfusion_flutter_core: ^29.1.37
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  hive_ce_generator: ^1.8.2
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/svgs/
    - assets/icons/
  fonts:
    - family: Yekan
      fonts:
        - asset: assets/fonts/IRANYekanMobileBold.ttf
          weight: 600
        - asset: assets/fonts/IRANYekanMobileMedium.ttf
          weight: 500
        - asset: assets/fonts/IRANYekanMobileRegular.ttf
          weight: 400
        - asset: assets/fonts/IRANYekanMobileExtraBold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
